name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Run unit tests
        # Avoid --summary all on macOS — can trigger --listen=- protocol hang
        run: zig build test

      - name: Run integration tests
        run: zig build test-integration

      - name: Build all targets (parallel)
        # Single zig build cross step replaces the old serial for-loop.
        # Compiles all 8 deployment targets in parallel via build.zig cross step.
        run: zig build cross -Doptimize=ReleaseSafe

      - name: Collect deployment binaries
        run: |
          mkdir -p release
          echo "==> Collecting deployment binaries..."
          for f in zig-out/bin/utmm-*; do
            if [ -f "$f" ]; then
              cp "$f" release/
              printf "    %8s  %s\n" "$(wc -c < "$f" | tr -d ' ')" "$(basename "$f")"
            fi
          done
          cp src/ver.txt release/
          echo "==> Release artifacts:"
          ls -lh release/

      - name: Package zip
        run: |
          cd release
          zip "../utmm.zip" *
          ls -lh ../utmm.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: utmm.zip
          generate_release_notes: true
