name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Run tests
        run: zig build test --summary all

      - name: Build all targets
        run: |
          mkdir -p release
          targets="x86_64-windows aarch64-windows x86-windows-gnu x86_64-macos aarch64-macos x86-linux-musl x86_64-linux-musl aarch64-linux-musl"
          for target in $targets; do
            echo "==> Building $target ..."
            zig build -Dtarget=$target -Doptimize=ReleaseSafe
            case "$target" in
              x86_64-windows)       bin="utmm-x86_64-windows.exe" ;;
              aarch64-windows)      bin="utmm-aarch64-windows.exe" ;;
              x86-windows-gnu)      bin="utmm-x86-windows.exe" ;;
              x86_64-macos)         bin="utmm-x86_64-macos" ;;
              aarch64-macos)        bin="utmm-aarch64-macos" ;;
              x86-linux-musl)       bin="utmm-x86-linux" ;;
              x86_64-linux-musl)    bin="utmm-x86_64-linux" ;;
              aarch64-linux-musl)   bin="utmm-aarch64-linux" ;;
            esac
            cp "zig-out/bin/$bin" "release/"
          done
          echo "==> Release artifacts:"
          ls -lh release/

      - name: Copy install scripts
        run: |
          echo "==> Adding install scripts..."
          cp install.sh release/
          cp install.bat release/
          echo "==> Final release contents:"
          ls -lh release/

      - name: Package zip
        run: |
          cd release
          zip "../utmm.zip" *
          ls -lh ../utmm.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: utmm.zip
          generate_release_notes: true
