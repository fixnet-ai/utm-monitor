name: Release

on:
  push:
    tags: ['v*']
  # 手动触发用于验证完整构建链（测试 + 8 目标交叉编译）。
  # 非 tag 引用触发时 release job 自动跳过，不会发布。
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # build.zig.zon 依赖本地 sibling ../zio（x86-32 支持在 fork 分支，
  # 等上游 PR #646 合并后改回 URL 依赖并删除克隆步骤）。
  ZIO_REPO: https://github.com/fixnet-ai/zio.git
  ZIO_BRANCH: feat/x86-32

jobs:
  build:
    name: Test + build 8 targets
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone zio dependency (sibling path)
        # CI checkout 后 ../zio 不存在 → zig build 直接 FileNotFound。
        # 必须在 setup/build 前克隆到 sibling 路径。
        run: git clone --depth 1 -b "$ZIO_BRANCH" "$ZIO_REPO" ../zio

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Run unit tests
        # Avoid --summary all on macOS — can trigger --listen=- protocol hang
        run: zig build test

      - name: Run integration tests
        run: zig build test-integration

      # 默认 -Dutmmd=true：每次从源码重建 supervisor 并嵌入——发布产物的
      # utmmd 永远新鲜，旧 release.sh 的 --utmmd/--no-utmmd 模式判定不再需要。
      - name: Build all targets (parallel)
        run: zig build cross -Doptimize=ReleaseSafe

      - name: Collect deployment binaries
        run: |
          mkdir -p dist
          echo "==> Collecting deployment binaries..."
          for f in zig-out/bin/utmm-*; do
            if [ -f "$f" ]; then
              cp "$f" dist/
              printf "    %8s  %s\n" "$(wc -c < "$f" | tr -d ' ')" "$(basename "$f")"
            fi
          done
          cp src/ver.txt dist/
          echo "==> dist artifacts:"
          ls -lh dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  sign:
    # SignPath Windows Authenticode 签名（3 个 utmm-*-windows.exe）。
    # 默认跳过——SignPath OSS 申请批准并配置 secrets
    # (SIGNPATH_API_TOKEN / SIGNPATH_ORGANIZATION_ID) + variable
    # (SIGNPATH_ENABLED=true) 后自动生效。SignPath 后台还需配置:
    #   Trusted Build System "GitHub.com" + project "utm-monitor" +
    #   signing policy "release-signing" + Artifact Configuration
    #   (zip 根元素, 签 *.exe)
    needs: build
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: macos-latest # SignPath OSS 要求全部 job 在 GitHub 托管 runner
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # SignPath 要求签名对象先作为 GitHub workflow artifact 存在
      # (trusted build system 验证 origin)，github-artifact-id 由它引用
      - name: Upload unsigned Windows exes (SignPath input)
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-exe
          path: dist/utmm-*-windows.exe

      - name: Submit SignPath signing request
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: utm-monitor
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Overwrite dist with signed exes
        run: |
          echo "==> Signed exes:"
          ls -lh signed/
          cp -f signed/utmm-*-windows.exe dist/
          shasum -a 256 dist/utmm-*-windows.exe

      - name: Upload signed dist
        uses: actions/upload-artifact@v7
        with:
          name: signed-dist
          path: dist/*

  release:
    needs: [build, sign]
    # sign 未启用 (skipped) 或成功均发布；仅在 tag 引用上执行
    # (workflow_dispatch 从分支手动触发时 github.ref 不是 tag → 跳过发布)
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success' &&
      (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Download signed dist
        if: needs.sign.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: signed-dist
          path: dist

      - name: Download dist (unsigned fallback)
        if: needs.sign.result != 'success'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Package zip
        run: |
          cd dist
          zip ../utmm.zip *
          ls -lh ../utmm.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: utmm.zip
          generate_release_notes: true
