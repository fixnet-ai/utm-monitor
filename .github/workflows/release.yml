name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Run tests
        run: zig build test --summary all

      - name: Build all targets
        # zig build orchestrates a two-step build internally:
        #   1. Build utmmd (supervisor daemon) → cp to src/embed/utmmd.bin
        #   2. shasum utmmd.bin → src/embed/utmmd.sha256
        #   3. Build utmm (main binary, @embedFile utmmd.bin + utmmd.sha256)
        # Deployment filenames include version suffix (e.g. utmm-aarch64-linux-0.11.23).
        run: |
          mkdir -p release
          targets="x86_64-windows aarch64-windows x86-windows-gnu x86_64-macos aarch64-macos x86-linux-musl x86_64-linux-musl aarch64-linux-musl"
          for target in $targets; do
            echo "==> Building $target ..."
            zig build -Dtarget=$target -Doptimize=ReleaseSafe
          done
          echo "==> Collecting deployment binaries..."
          for f in zig-out/bin/utmm-*; do
            if [ -f "$f" ]; then
              cp "$f" release/
              printf "    %8s  %s\n" "$(wc -c < "$f" | tr -d ' ')" "$(basename "$f")"
            fi
          done
          echo "==> Release artifacts:"
          ls -lh release/

      - name: Copy install scripts and version file
        run: |
          echo "==> Adding install scripts + ver.txt..."
          cp install.sh release/
          cp install.bat release/
          cp src/ver.txt release/
          echo "==> Final release contents:"
          ls -lh release/

      - name: Package zip
        run: |
          cd release
          zip "../utmm.zip" *
          ls -lh ../utmm.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: utmm.zip
          generate_release_notes: true
